<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toku - ZEN大学 知能情報社会学部</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@200;300;400&family=Prompt:wght@200;300;400&display=swap" rel="stylesheet">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ['"Noto Serif JP"', 'serif'],
            prompt: ['"Prompt"', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-black text-[#e5e5e5] font-serif antialiased min-h-screen selection:bg-neutral-800 selection:text-white relative">

  <!-- 星空・スクロール連動レイヤー（微細な光の粒子） -->
  <div class="stars-backdrop" aria-hidden="true">
    <div class="star-layer layer-far"></div>
    <div class="star-layer layer-mid"></div>
    <div class="star-layer layer-near"></div>
  </div>

  <!-- メインレイアウト -->
  <div class="relative z-10 max-w-3xl mx-auto px-6 py-16 sm:px-12 sm:py-24 flex flex-col min-h-screen justify-between">

    <div class="space-y-20">

      <!-- ヘッダー -->
      <header class="border-b border-[#232323] pb-10 flex flex-col sm:flex-row sm:items-baseline sm:justify-between gap-3">
        <div>
          <h1 class="font-prompt font-light text-3xl sm:text-4xl text-white tracking-[0.05em] mb-2">Toku</h1>
          <p class="font-prompt font-extralight text-xs sm:text-sm text-neutral-400 tracking-[0.15em]">ZEN大学 知能情報社会学部 2年</p>
        </div>
      </header>

      <!-- 私について -->
      <section>
        <h2 class="font-serif font-extralight text-lg sm:text-xl text-white tracking-[0.2em] border-b border-[#232323] pb-3 mb-8">
          私について
        </h2>
        <div class="font-serif font-extralight text-sm sm:text-base leading-[2.4] tracking-[0.06em] text-neutral-300 space-y-6">
          <p>
            2022年に専門学校を卒業後、アルバイトを続けながら過ごしていました。
          </p>
          <p>
            その中でZEN大学ができることを知り、またAIについてしっかり学びたいという思いから、2025年4月に入学しました。現在は知能情報社会学部の2年生です。
          </p>
        </div>
      </section>

      <!-- リンク -->
      <section>
        <h2 class="font-serif font-extralight text-lg sm:text-xl text-white tracking-[0.2em] border-b border-[#232323] pb-3 mb-6">
          リンク
        </h2>
        <div class="divide-y divide-[#232323]">
          <a href="https://github.com/toku0716" target="_blank" rel="noopener noreferrer" class="py-5 flex justify-between items-center group transition-opacity hover:opacity-60">
            <span class="font-prompt font-light text-sm sm:text-base text-neutral-200 tracking-[0.06em]">GitHub</span>
            <span class="font-prompt font-extralight text-xs text-neutral-500 tracking-[0.05em] flex items-center gap-1 group-hover:text-white transition-colors">
              github.com/toku0716
              <span class="transform group-hover:translate-x-1 group-hover:-translate-y-1 transition-transform">↗</span>
            </span>
          </a>

          <a href="https://x.com" target="_blank" rel="noopener noreferrer" class="py-5 flex justify-between items-center group transition-opacity hover:opacity-60">
            <span class="font-prompt font-light text-sm sm:text-base text-neutral-200 tracking-[0.06em]">X (Twitter)</span>
            <span class="font-prompt font-extralight text-xs text-neutral-500 tracking-[0.05em] flex items-center gap-1 group-hover:text-white transition-colors">
              x.com
              <span class="transform group-hover:translate-x-1 group-hover:-translate-y-1 transition-transform">↗</span>
            </span>
          </a>
        </div>
      </section>

    </div>

    <!-- フッター -->
    <footer class="border-t border-[#232323] pt-8 mt-24 text-center sm:text-left flex flex-col sm:flex-row justify-between items-center gap-3">
      <p class="font-prompt font-extralight text-[11px] text-neutral-500 tracking-[0.1em]">© 2026 Toku</p>
      <p class="font-prompt font-extralight text-[11px] text-neutral-600 tracking-[0.12em]">ZEN UNIVERSITY</p>
    </footer>

  </div>

</body>
</html>
