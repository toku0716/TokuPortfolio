<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toku - ZEN大学 知能情報社会学部</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#fafafa] text-neutral-800 font-sans antialiased min-h-screen selection:bg-neutral-200">

  <div class="max-w-2xl mx-auto px-6 py-16 sm:py-24">

    <!-- ヘッダー -->
    <header class="border-b border-neutral-200 pb-8 mb-10">
      <h1 class="text-3xl sm:text-4xl font-bold text-neutral-900 tracking-tight mb-2">Toku</h1>
      <p class="text-base text-neutral-600 font-medium">ZEN大学 知能情報社会学部 2年生</p>
    </header>

    <!-- メインコンテンツ -->
    <main class="space-y-10">

      <!-- 私について -->
      <section>
        <h2 class="text-xs font-mono font-semibold tracking-wider text-neutral-500 uppercase mb-3">
          私について
        </h2>
        <div class="bg-white border border-neutral-200 rounded-xl p-6 sm:p-8 shadow-sm space-y-4 text-neutral-700 text-base leading-relaxed">
          <p>
            2022年に専門学校を卒業後、アルバイトを続けながら過ごしていました。
          </p>
          <p>
            その中でZEN大学ができることを知り、またAIについてしっかり学びたいという思いから、2025年4月に入学しました。現在は知能情報社会学部の2年生です。
          </p>
        </div>
      </section>

      <!-- リンク -->
      <section>
        <h2 class="text-xs font-mono font-semibold tracking-wider text-neutral-500 uppercase mb-3">
          リンク
        </h2>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <a href="https://github.com/toku0716" target="_blank" rel="noopener noreferrer"
             class="flex justify-between items-center p-4 bg-white border border-neutral-200 rounded-xl shadow-sm hover:border-neutral-400 hover:shadow transition-all group">
            <div>
              <span class="text-base font-semibold text-neutral-900 group-hover:text-blue-600 transition-colors block">GitHub</span>
              <span class="text-xs text-neutral-500 font-mono mt-0.5 block">github.com/toku0716</span>
            </div>
            <span class="text-neutral-400 group-hover:text-blue-600 group-hover:translate-x-0.5 group-hover:-translate-y-0.5 transition-transform text-sm ml-2">↗</span>
          </a>

          <a href="https://x.com" target="_blank" rel="noopener noreferrer"
             class="flex justify-between items-center p-4 bg-white border border-neutral-200 rounded-xl shadow-sm hover:border-neutral-400 hover:shadow transition-all group">
            <div>
              <span class="text-base font-semibold text-neutral-900 group-hover:text-blue-600 transition-colors block">X (Twitter)</span>
              <span class="text-xs text-neutral-500 font-mono mt-0.5 block">x.com</span>
            </div>
            <span class="text-neutral-400 group-hover:text-blue-600 group-hover:translate-x-0.5 group-hover:-translate-y-0.5 transition-transform text-sm ml-2">↗</span>
          </a>
        </div>
      </section>

    </main>

    <!-- フッター -->
    <footer class="border-t border-neutral-200 mt-16 pt-8 text-center text-xs text-neutral-500">
      <p>© 2026 Toku — ZEN大学 知能情報社会学部</p>
    </footer>

  </div>

</body>
</html>
