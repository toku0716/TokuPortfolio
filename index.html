<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toku</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- スクロール連動・星空背景レイヤー -->
  <div class="stars-backdrop" aria-hidden="true">
    <div class="star-layer layer-far"></div>
    <div class="star-layer layer-mid"></div>
    <div class="star-layer layer-near"></div>
    <div class="sparkle-group">
      <span class="sparkle-star sp-1">✦</span>
      <span class="sparkle-star sp-2">✦</span>
      <span class="sparkle-star sp-3">★</span>
      <span class="sparkle-star sp-4">✦</span>
      <span class="sparkle-star sp-5">✦</span>
    </div>
  </div>

  <div class="layout">

    <!-- ナビゲーション / トップバー -->
    <header class="topbar">
      <div class="topbar-brand">
        <span class="brand-name">Toku</span>
        <span class="brand-divider">/</span>
        <span class="brand-meta">ZEN大学 知能情報社会学部 2年</span>
      </div>
    </header>

    <!-- Figma 2026 ベントーグリッド -->
    <main class="bento-grid">

      <!-- 私について -->
      <section class="bento-box bento-large">
        <div class="box-header">
          <h2 class="box-label">私について</h2>
        </div>
        <div class="box-body">
          <p class="body-lead">
            2022年に専門学校を卒業後、アルバイトを続けながら過ごしていました。
          </p>
          <p class="body-sub">
            その中でZEN大学ができることを知り、またAIについてしっかり学びたいという思いから、2025年4月に入学しました。現在は知能情報社会学部の2年生です。
          </p>
        </div>
      </section>

      <!-- 活動 -->
      <section class="bento-box">
        <div class="box-header">
          <h2 class="box-label">活動</h2>
        </div>
        <div class="box-body">
          <h3 class="entry-title">磁石祭ZERO 番組台本担当</h3>
          <p class="entry-desc">
            2025年に開催されたZEN大学初の文化祭「磁石祭ZERO」にて、番組の台本制作を担当しました。
          </p>
        </div>
      </section>

      <!-- リンク -->
      <section class="bento-box">
        <div class="box-header">
          <h2 class="box-label">リンク</h2>
        </div>
        <div class="box-body">
          <div class="link-stack">
            <a href="https://github.com/toku0716" target="_blank" rel="noopener noreferrer" class="link-item">
              <span class="link-name">GitHub</span>
              <span class="link-arrow">↗</span>
            </a>
            <a href="https://x.com" target="_blank" rel="noopener noreferrer" class="link-item">
              <span class="link-name">X</span>
              <span class="link-arrow">↗</span>
            </a>
          </div>
        </div>
      </section>

    </main>

    <!-- フッター -->
    <footer class="footer">
      <p>© 2026 Toku</p>
    </footer>

  </div>

</body>
</html>
