<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toku - ZEN大学 知能情報社会学部</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-[#0b0c10] text-neutral-100 font-sans antialiased min-h-screen selection:bg-neutral-800 selection:text-white relative">

  <!-- スクロール連動・星空背景レイヤー -->
  <div class="stars-backdrop" aria-hidden="true">
    <div class="star-layer layer-far"></div>
    <div class="star-layer layer-mid"></div>
    <div class="star-layer layer-near"></div>
  </div>

  <!-- メインコンテナ -->
  <div class="relative z-10 max-w-2xl mx-auto px-5 py-12 sm:px-8 sm:py-20 flex flex-col min-h-screen justify-between">

    <div class="space-y-8">

      <!-- ヘッダー -->
      <header class="bg-[#13141c]/80 backdrop-blur-md border border-neutral-800/80 rounded-2xl p-6 sm:p-8 flex flex-col sm:flex-row sm:items-baseline sm:justify-between gap-2 shadow-lg">
        <div>
          <h1 class="text-3xl sm:text-4xl font-bold tracking-tight text-white mb-1.5">Toku</h1>
          <p class="text-sm sm:text-base text-neutral-400 font-medium">ZEN大学 知能情報社会学部 2年</p>
        </div>
      </header>

      <!-- 私について -->
      <section class="bg-[#13141c]/80 backdrop-blur-md border border-neutral-800/80 rounded-2xl p-6 sm:p-8 shadow-lg">
        <h2 class="text-xs font-mono font-semibold tracking-wider text-neutral-400 uppercase mb-4 pb-2 border-b border-neutral-800">
          私について
        </h2>
        <div class="text-neutral-200 text-base sm:text-[17px] leading-relaxed space-y-4">
          <p>
            2022年に専門学校を卒業後、アルバイトを続けながら過ごしていました。
          </p>
          <p>
            その中でZEN大学ができることを知り、またAIについてしっかり学びたいという思いから、2025年4月に入学しました。現在は知能情報社会学部の2年生です。
          </p>
        </div>
      </section>

      <!-- リンク -->
      <section class="bg-[#13141c]/80 backdrop-blur-md border border-neutral-800/80 rounded-2xl p-6 sm:p-8 shadow-lg">
        <h2 class="text-xs font-mono font-semibold tracking-wider text-neutral-400 uppercase mb-4 pb-2 border-b border-neutral-800">
          リンク
        </h2>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <a href="https://github.com/toku0716" target="_blank" rel="noopener noreferrer" 
             class="flex justify-between items-center p-4 rounded-xl bg-neutral-900/60 border border-neutral-800 hover:border-neutral-600 hover:bg-neutral-850 transition-all group">
            <div>
              <span class="text-base font-semibold text-white group-hover:text-sky-300 transition-colors block">GitHub</span>
              <span class="text-xs text-neutral-400 font-mono mt-0.5 block">github.com/toku0716</span>
            </div>
            <span class="text-neutral-400 group-hover:text-white group-hover:translate-x-0.5 group-hover:-translate-y-0.5 transition-all text-sm ml-2">↗</span>
          </a>

          <a href="https://x.com" target="_blank" rel="noopener noreferrer" 
             class="flex justify-between items-center p-4 rounded-xl bg-neutral-900/60 border border-neutral-800 hover:border-neutral-600 hover:bg-neutral-850 transition-all group">
            <div>
              <span class="text-base font-semibold text-white group-hover:text-sky-300 transition-colors block">X (Twitter)</span>
              <span class="text-xs text-neutral-400 font-mono mt-0.5 block">x.com</span>
            </div>
            <span class="text-neutral-400 group-hover:text-white group-hover:translate-x-0.5 group-hover:-translate-y-0.5 transition-all text-sm ml-2">↗</span>
          </a>
        </div>
      </section>

    </div>

    <!-- フッター -->
    <footer class="pt-12 text-center text-xs text-neutral-500 font-mono">
      <p>© 2026 Toku — ZEN UNIVERSITY</p>
    </footer>

  </div>

</body>
</html>
